server.port=8083
spring.application.name=appointment-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appointment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:17111998}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Resilience4j Aspect Order (1: RateLimiter -> 2: CircuitBreaker -> 3: Retry)
resilience4j.ratelimiter.rateLimiterAspectOrder=1
resilience4j.circuitbreaker.circuitBreakerAspectOrder=2
resilience4j.retry.retryAspectOrder=3

# Resilience4j RateLimiter Configuration for Doctor-Service
resilience4j.ratelimiter.instances.doctorRateLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.doctorRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.doctorRateLimiter.timeout-duration=0

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.doctorServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.doctorServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.doctorServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.doctorServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.doctorServiceCB.ignore-exceptions=com.example.appointmentservice.exception.ResourceNotFoundException,com.example.appointmentservice.exception.BadRequestException

# Resilience4j Retry Configuration for Doctor-Service
resilience4j.retry.instances.doctorRetry.max-attempts=3
resilience4j.retry.instances.doctorRetry.wait-duration=1s
resilience4j.retry.instances.doctorRetry.retry-exceptions=org.springframework.web.client.ResourceAccessException,com.example.appointmentservice.exception.ServiceUnavailableException,java.lang.Exception

# Resilience4j Retry Configuration for Patient-Service
resilience4j.retry.instances.patientRetry.max-attempts=3
resilience4j.retry.instances.patientRetry.wait-duration=2s
resilience4j.retry.instances.patientRetry.retry-exceptions=org.springframework.web.client.ResourceAccessException

# Logging configuration for Resilience4j
logging.level.io.github.resilience4j=DEBUG
